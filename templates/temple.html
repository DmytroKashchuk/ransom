<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historical Ransomware Incidents (Temple DB)</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    body { margin:0; background: #1e293b; }
    .container { max-width:100%; padding:18px 20px 60px; }
    .panel { background:#fff; border-radius:16px; padding:20px 24px 30px; box-shadow:0 12px 32px -8px rgba(0,0,0,0.25); }
    .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .filter-input { padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; min-width:200px; font-size:14px; }
    .btn { padding:10px 14px; border:1px solid #6366f1; background:#6366f1; color:#fff; border-radius:8px; cursor:pointer; }
    .btn-alt { background:#64748b; border-color:#64748b; }
    .stats { display:flex; flex-wrap:wrap; gap:14px; margin:4px 0 18px; }
    .stat { background:#f1f5f9; padding:10px 14px; border-radius:10px; font-size:13px; line-height:1.3; min-width:150px; }
    .top-scroll { overflow-x:auto; overflow-y:hidden; height:14px; margin:8px 0 10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; }
    .top-scroll::-webkit-scrollbar { height:10px; }
    .top-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; }
    .top-scroll::-webkit-scrollbar-track { background:#f1f5f9; }
    .badge { display:inline-block; padding:2px 6px; font-size:11px; border-radius:4px; background:#6366f1; color:#fff; }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container">
    <div class="panel">
      <h1 style="margin:0 0 12px; font-size:1.8rem;">Historical Ransomware Incidents Temple DB</h1>
      <div class="stats" id="stats-bar">
        <div class="stat">Incidents<br><strong id="stat-incidents">0</strong></div>
        <div class="stat">Years<br><strong id="stat-years">0</strong></div>
        <div class="stat">Sectors<br><strong id="stat-sectors">0</strong></div>
        <div class="stat">Strains<br><strong id="stat-strains">0</strong></div>
        <div class="stat">Paid %<br><strong id="stat-paid-pct">0%</strong></div>
      </div>
      <div class="filters">
        <input id="flt-org" class="filter-input" placeholder="Org name" />
        <input id="flt-location" class="filter-input" placeholder="Location" />
        <input id="flt-sector" class="filter-input" placeholder="Primary sector" />
        <input id="flt-strain" class="filter-input" placeholder="Strain group" />
        <input id="flt-year" class="filter-input" placeholder="Year" />
        <input id="flt-paid" class="filter-input" placeholder="Paid? (Yes/No)" />
        <button id="btn-reset" class="btn-alt btn" type="button">Reset</button>
        <button id="btn-export" class="btn" type="button">Download CSV</button>
      </div>
      <div id="top-scroll" class="top-scroll" style="display:none;">
        <div id="top-scroll-spacer"></div>
      </div>
      <div id="temple-table"></div>
    </div>
  </div>
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  <script>
    let table; let rawData=[];

    function syncTopScrollWidth() {
      const spacer=document.getElementById('top-scroll-spacer');
      const tableEl=document.querySelector('#temple-table .tabulator-table');
      if(spacer&&tableEl) spacer.style.width=tableEl.scrollWidth+'px';
    }
    function setupTopScroll(){
      const top=document.getElementById('top-scroll');
      const holder=document.querySelector('#temple-table .tabulator-tableholder');
      if(!top||!holder) return; top.addEventListener('scroll',()=>holder.scrollLeft=top.scrollLeft); holder.addEventListener('scroll',()=>top.scrollLeft=holder.scrollLeft); syncTopScrollWidth(); top.style.display='block'; if(window.ResizeObserver){const el=document.querySelector('#temple-table .tabulator-table'); if(el) new ResizeObserver(syncTopScrollWidth).observe(el);} window.addEventListener('resize',syncTopScrollWidth);
    }

    function updateStats(data){
      document.getElementById('stat-incidents').textContent=data.length;
      document.getElementById('stat-years').textContent=new Set(data.map(r=>r.year).filter(Boolean)).size;
      document.getElementById('stat-sectors').textContent=new Set(data.map(r=>r.primary_ci_sector).filter(Boolean)).size;
      document.getElementById('stat-strains').textContent=new Set(data.map(r=>r.strain_group).filter(Boolean)).size;
      const paid=data.filter(r=>String(r.paid_status||'').toLowerCase()==='yes').length;
      document.getElementById('stat-paid-pct').textContent=data.length?((paid/data.length*100).toFixed(1)+'%'):'0%';
    }

    function buildTable(data){
      table=new Tabulator('#temple-table',{
        data,
        layout:'fitData',
        pagination:true,
        paginationSize:300,
        movableColumns:true,
        initialSort:[{column:'year',dir:'desc'}],
        columnDefaults:{resizable:true,minWidth:120},
        columns:[
          {title:'ID', field:'id', width:70},
          {title:'Date Began', field:'date_began', width:140},
          {title:'Year', field:'year', width:90},
          {title:'Org Name', field:'org_name', width:240},
          {title:'Location', field:'location', width:160},
            {title:'Primary Sector', field:'primary_ci_sector', width:180},
            {title:'Secondary Sector', field:'secondary_ci_sector', width:180},
            {title:'Strain', field:'strain_group', width:140},
            {title:'MITRE ATT&CK ID', field:'mitre_attack_id', width:150},
            {title:'Duration', field:'duration', width:140},
            {title:'Duration Rank', field:'duration_rank', width:140},
            {title:'Ransom Amount', field:'ransom_amount', width:160},
            {title:'Local Currency', field:'local_currency', width:160},
            {title:'Ransom Scale', field:'ransom_scale', width:160},
            {title:'Paid Status', field:'paid_status', width:120},
            {title:'Pay Method', field:'pay_method', width:140},
            {title:'Amount Paid', field:'amount_paid', width:140},
            {title:'Source', field:'source', width:320, formatter: (cell)=>{ const v=cell.getValue(); if(!v) return '-'; return `<a href="${v}" target="_blank" style="color:#6366f1;">link</a>`;}},
            {title:'Related Incidents', field:'related_incidents', width:180},
            {title:'Comments', field:'comments', width:300},
        ],
      });
      table.on('tableBuilt',()=>{setupTopScroll(); updateStats(table.getData());});
      table.on('dataFiltered',(filters,rows)=>updateStats(rows.map(r=>r.getData())));
      table.on('columnResized',syncTopScrollWidth);
      table.on('columnMoved',syncTopScrollWidth);
      table.on('renderComplete',syncTopScrollWidth);
    }

    function applyFilters(){
      const org=document.getElementById('flt-org').value.trim().toLowerCase();
      const loc=document.getElementById('flt-location').value.trim().toLowerCase();
      const sec=document.getElementById('flt-sector').value.trim().toLowerCase();
      const strain=document.getElementById('flt-strain').value.trim().toLowerCase();
      const year=document.getElementById('flt-year').value.trim();
      const paid=document.getElementById('flt-paid').value.trim().toLowerCase();
      table.setFilter((data)=>{
        if(org && !(String(data.org_name||'').toLowerCase().includes(org))) return false;
        if(loc && !(String(data.location||'').toLowerCase().includes(loc))) return false;
        if(sec && !(String(data.primary_ci_sector||'').toLowerCase().includes(sec))) return false;
        if(strain && !(String(data.strain_group||'').toLowerCase().includes(strain))) return false;
        if(year && String(data.year||'')!==year) return false;
        if(paid && String(data.paid_status||'').toLowerCase()!==paid) return false;
        return true;
      });
    }

    function attachFilterHandlers(){
      ['flt-org','flt-location','flt-sector','flt-strain','flt-year','flt-paid'].forEach(id=>{
        document.getElementById(id).addEventListener('input', applyFilters);
      });
      document.getElementById('btn-reset').addEventListener('click',()=>{
        ['flt-org','flt-location','flt-sector','flt-strain','flt-year','flt-paid'].forEach(id=>document.getElementById(id).value='');
        table.clearFilter(); updateStats(table.getData());
      });
      document.getElementById('btn-export').addEventListener('click',()=>{
        const visibleCols=table.getColumns().filter(c=>c.isVisible && c.isVisible()).map(c=>c.getField()).filter(Boolean);
        table.download('csv','temple_incidents.csv',{columns:visibleCols,rowRange:'active'});
      });
    }

    async function init(){
      const res=await fetch('/api/temple');
      const data=await res.json();
      rawData=data; buildTable(data); attachFilterHandlers();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
