<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ransomware.live Feed</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      background: #1e293b;
    }

    .container {
      max-width: 100%;
      padding: 18px 20px 60px;
    }

    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 20px 24px 30px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.25);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      min-width: 200px;
      font-size: 14px;
    }

    .btn {
      padding: 10px 14px;
      border: 1px solid #6366f1;
      background: #6366f1;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-alt {
      background: #64748b;
      border-color: #64748b;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 4px 0 18px;
    }

    .stat {
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.3;
      min-width: 150px;
    }

    .top-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      height: 14px;
      margin: 8px 0 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .top-scroll::-webkit-scrollbar {
      height: 10px;
    }

    .top-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .top-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .update-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 12px;
      flex-wrap: wrap;
    }

    .update-note {
      color: #475569;
      font-size: 13px;
    }

    .chart-card {
      margin: 8px 0 16px;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #f8fafc;
    }

    .chart-header {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chart-body {
      position: relative;
      height: 320px;
    }

    #rw-year-chart-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>
  {% include 'navbar.html' %}
  <div class="container">
    <div class="panel">
      <h1 style="margin:0 0 12px; font-size:1.8rem;">Ransomware.live Feed</h1>
      <div class="update-row">
        <button id="btn-update" class="btn" type="button">Update</button>
        <span class="update-note">Last update: <strong id="last-update">-</strong></span>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <span>Ransom attacks over the years (all vs. municipalities)</span>
          <select id="chart-mode" class="filter-input" style="min-width: 180px; padding:8px 10px;">
            <option value="both" selected>Show both</option>
            <option value="muni_only">Only municipalities</option>
            <option value="total_only">Only total</option>
            <option value="muni_vs_others">Municipalities vs others</option>
            <option value="muni_vs_total">Municipalities vs total</option>
          </select>
        </div>
        <div class="chart-body">
          <canvas id="rw-year-chart" aria-label="Ransom attacks per year" role="img"></canvas>
          <div id="rw-year-chart-placeholder">No year data available</div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <span>Attacks by sector (Government vs Healthcare vs Others)</span>
        </div>
        <div class="chart-body">
          <canvas id="rw-sector-chart" aria-label="Ransom attacks by sector per year" role="img"></canvas>
          <div id="rw-sector-chart-placeholder">No activity/year data available</div>
        </div>
      </div>
      <div class="stats" id="stats-bar">
        <div class="stat">Posts<br><strong id="stat-posts">0</strong></div>
        <div class="stat">Groups<br><strong id="stat-groups">0</strong></div>
        <div class="stat">Countries<br><strong id="stat-countries">0</strong></div>
        <div class="stat">Activities<br><strong id="stat-activities">0</strong></div>
        <div class="stat">Date Range<br><strong id="stat-range">-</strong></div>
      </div>
      <div class="filters">
        <input id="flt-title" class="filter-input" placeholder="Post title" />
        <input id="flt-group" class="filter-input" placeholder="Group" />
        <input id="flt-country" class="filter-input" placeholder="Country" />
        <input id="flt-activity" class="filter-input" placeholder="Activity" />
        <input id="flt-website" class="filter-input" placeholder="Website" />
        <input id="flt-date-from" type="date" class="filter-input" />
        <input id="flt-date-to" type="date" class="filter-input" />
        <button id="btn-reset" class="btn-alt btn" type="button">Reset</button>
        <button id="btn-export" class="btn" type="button">Download CSV</button>
      </div>
      <div id="top-scroll" class="top-scroll" style="display:none;">
        <div id="top-scroll-spacer"></div>
      </div>
      <div id="rw-table"></div>
    </div>
  </div>
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  <script>
    let table; let fullData = []; let rwYearChart=null; let sectorChart=null; let chartCounts={all:{}, muni:{}}; let sectorCounts={}; let chartMode='both';
    const muniKeywords=["city","county","town","muni","municipal","school","district",".gov","library","libraries","police","fire","sheriff"];
    const sectorPalette={ gov:{bg:'rgba(37,99,235,0.55)', border:'#2563eb'}, health:{bg:'rgba(34,197,94,0.55)', border:'#22c55e'}, other:{bg:'rgba(148,163,184,0.55)', border:'#94a3b8'} };
    function getYear(val){
      if(val===null||val===undefined) return null;
      if(typeof val==='number' && val>1900 && val<2100) return Math.floor(val);
      if(typeof val==='string'){
        const m=val.match(/(19|20)\d{2}/);
        if(m){ const y=parseInt(m[0],10); if(y>1900 && y<2100) return y; }
      }
      return null;
    }
    function isMunicipal(row){
      const text=((row.post_title||'')+' '+(row.description||'')).toLowerCase();
      return muniKeywords.some(k=>text.includes(k));
    }
    function activityCategory(row){
      const act=(row.activity||'').toLowerCase();
      if(act.includes('gov')) return 'Government';
      if(act.includes('health')) return 'Healthcare';
      return 'Others';
    }
    function updateYearChart(allCounts, muniCounts){
      const canvas=document.getElementById('rw-year-chart');
      const placeholder=document.getElementById('rw-year-chart-placeholder');
      if(!canvas||!placeholder) return;
      const years=Array.from(new Set([...Object.keys(allCounts), ...Object.keys(muniCounts)])).map(y=>parseInt(y,10)).filter(Number.isInteger).sort((a,b)=>a-b);
      const lastYears = years.slice(-6);
      const labels=lastYears.map(String);
      // const labels=years.map(String);
      const dataAll=labels.map(y=>allCounts[y]||0);
      const dataMuni=labels.map(y=>muniCounts[y]||0);
      const dataOthers=labels.map((_,i)=>Math.max(0, dataAll[i]-dataMuni[i]));
      placeholder.style.display = labels.length ? 'none' : 'flex';
      const palette={ total:{bg:'rgba(99,102,241,0.55)', border:'#6366f1'}, muni:{bg:'rgba(14,165,233,0.55)', border:'#0ea5e9'}, other:{bg:'rgba(249,115,22,0.55)', border:'#f97316'} };
      let datasets;
      switch(chartMode){
        case 'muni_only':
          datasets=[{label:'Municipality-related', data:dataMuni, backgroundColor:palette.muni.bg, borderColor:palette.muni.border, borderWidth:1.5, borderRadius:6}];
          break;
        case 'total_only':
          datasets=[{label:'All attacks', data:dataAll, backgroundColor:palette.total.bg, borderColor:palette.total.border, borderWidth:1.5, borderRadius:6}];
          break;
        case 'muni_vs_others':
          datasets=[
            {label:'Municipality-related', data:dataMuni, backgroundColor:palette.muni.bg, borderColor:palette.muni.border, borderWidth:1.5, borderRadius:6},
            {label:'Others', data:dataOthers, backgroundColor:palette.other.bg, borderColor:palette.other.border, borderWidth:1.5, borderRadius:6}
          ];
          break;
        case 'muni_vs_total':
          datasets=[
            {label:'Municipality-related', data:dataMuni, backgroundColor:palette.muni.bg, borderColor:palette.muni.border, borderWidth:1.5, borderRadius:6},
            {label:'All attacks', data:dataAll, backgroundColor:palette.total.bg, borderColor:palette.total.border, borderWidth:1.5, borderRadius:6}
          ];
          break;
        case 'both':
        default:
          datasets=[
            {label:'All attacks', data:dataAll, backgroundColor:palette.total.bg, borderColor:palette.total.border, borderWidth:1.5, borderRadius:6},
            {label:'Municipality-related', data:dataMuni, backgroundColor:palette.muni.bg, borderColor:palette.muni.border, borderWidth:1.5, borderRadius:6}
          ];
          break;
      }
      if(!rwYearChart){
        rwYearChart=new Chart(canvas,{type:'bar', data:{labels,datasets}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}}}});
      } else {
        rwYearChart.data.labels=labels;
        rwYearChart.data.datasets=datasets;
        rwYearChart.update();
      }
    }

    function updateSectorChart(counts){
      const canvas=document.getElementById('rw-sector-chart');
      const placeholder=document.getElementById('rw-sector-chart-placeholder');
      if(!canvas||!placeholder) return;
      const years=Object.keys(counts).map(y=>parseInt(y,10)).filter(Number.isInteger).sort((a,b)=>a-b);
      const lastYears=years.slice(-6);
      const labels=lastYears.map(String);
      const dataGov=labels.map(y=> (counts[y]?.Government)||0);
      const dataHealth=labels.map(y=> (counts[y]?.Healthcare)||0);
      const dataOther=labels.map(y=> (counts[y]?.Others)||0);
      placeholder.style.display = labels.length ? 'none':'flex';
      const datasets=[
        {label:'Government', data:dataGov, backgroundColor:sectorPalette.gov.bg, borderColor:sectorPalette.gov.border, borderWidth:1.5, borderRadius:6},
        {label:'Healthcare', data:dataHealth, backgroundColor:sectorPalette.health.bg, borderColor:sectorPalette.health.border, borderWidth:1.5, borderRadius:6},
        {label:'Others', data:dataOther, backgroundColor:sectorPalette.other.bg, borderColor:sectorPalette.other.border, borderWidth:1.5, borderRadius:6}
      ];
      if(!sectorChart){
        sectorChart=new Chart(canvas,{type:'bar', data:{labels,datasets}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}}}});
      } else {
        sectorChart.data.labels=labels;
        sectorChart.data.datasets=datasets;
        sectorChart.update();
      }
    }
    function setLastUpdate(val){ const el=document.getElementById('last-update'); if(!el) return; if(!val){ el.textContent='-'; return; } const d=new Date(val); if(!isNaN(d)){ const iso=d.toISOString(); el.textContent=iso.replace('T',' ').replace('Z',' UTC'); } else { el.textContent=val; } }
    async function fetchLastUpdate(){ try{ const res=await fetch('/api/ransomware_live/last_updated'); const data=await res.json(); if(res.ok){ setLastUpdate(data.updated_at); } else { setLastUpdate(null); } }catch(e){ setLastUpdate(null); }}
    function syncTopScrollWidth() { const spacer = document.getElementById('top-scroll-spacer'); const el = document.querySelector('#rw-table .tabulator-table'); if (spacer && el) spacer.style.width = el.scrollWidth + 'px'; }
    function setupTopScroll() { const top = document.getElementById('top-scroll'); const holder = document.querySelector('#rw-table .tabulator-tableholder'); if (!top || !holder) return; top.addEventListener('scroll', () => holder.scrollLeft = top.scrollLeft); holder.addEventListener('scroll', () => top.scrollLeft = holder.scrollLeft); syncTopScrollWidth(); top.style.display = 'block'; if (window.ResizeObserver) { const el = document.querySelector('#rw-table .tabulator-table'); if (el) new ResizeObserver(syncTopScrollWidth).observe(el); } window.addEventListener('resize', syncTopScrollWidth); }
    function parseDate(val) { if (!val) return null; const d = new Date(val); return isNaN(d) ? null : d; }
    function updateStats(data) {
      document.getElementById('stat-posts').textContent = data.length;
      document.getElementById('stat-groups').textContent = new Set(data.map(r => r.group_name).filter(Boolean)).size;
      document.getElementById('stat-countries').textContent = new Set(data.map(r => r.country).filter(Boolean)).size;
      document.getElementById('stat-activities').textContent = new Set(data.map(r => r.activity).filter(Boolean)).size;
      if (data.length) {
        const dates = data.map(r => parseDate(r.discovered)).filter(Boolean).sort((a, b) => a - b);
        if (dates.length) {
          const fmt = d => d.toISOString().split('T')[0];
          document.getElementById('stat-range').textContent = fmt(dates[0]) + ' → ' + fmt(dates[dates.length - 1]);
        } else document.getElementById('stat-range').textContent = '-';
      } else document.getElementById('stat-range').textContent = '-';

      const allCounts = {};
      const muniCounts = {};
      const sectorYearCounts = {};
      data.forEach(r => {
        const year = getYear(r.discovered || r.published || r.post_date || r.date);
        if (!year) return;
        allCounts[year] = (allCounts[year] || 0) + 1;
        if (isMunicipal(r)) muniCounts[year] = (muniCounts[year] || 0) + 1;
        const cat = activityCategory(r);
        sectorYearCounts[year] = sectorYearCounts[year] || {Government:0, Healthcare:0, Others:0};
        sectorYearCounts[year][cat] = (sectorYearCounts[year][cat] || 0) + 1;
      });
      chartCounts = {all: allCounts, muni: muniCounts};
      updateYearChart(allCounts, muniCounts);
      sectorCounts = sectorYearCounts;
      updateSectorChart(sectorYearCounts);
    }
    function buildTable(data) { table = new Tabulator('#rw-table', { data, layout: 'fitData', pagination: true, paginationSize: 300, movableColumns: true, initialSort: [{ column: 'discovered', dir: 'desc' }], columnDefaults: { resizable: true, minWidth: 140 }, columns: [{ title: 'Post Title', field: 'post_title', width: 260 }, { title: 'Group', field: 'group_name', width: 140 }, { title: 'Discovered', field: 'discovered', width: 180 }, { title: 'Description', field: 'description', width: 320 }, { title: 'Published', field: 'published', width: 180 }, { title: 'Post URL', field: 'post_url', width: 300, formatter: (cell) => { const v = cell.getValue(); if (!v) return '-'; return `<a href="${v}" target="_blank" style="color:#6366f1;">link</a>`; } }, { title: 'Country', field: 'country', width: 120 }, { title: 'Activity', field: 'activity', width: 140 }, { title: 'Website', field: 'website', width: 220, formatter: (cell) => { const v = cell.getValue(); if (!v) return '-'; return `<a href="https://${v}" target="_blank" style="color:#6366f1;">${v}</a>`; } }, { title: 'Duplicates', field: 'duplicates', width: 140 },], }); table.on('tableBuilt', () => { setupTopScroll(); updateStats(table.getData()); }); table.on('dataFiltered', (_, rows) => updateStats(rows.map(r => r.getData()))); table.on('columnResized', syncTopScrollWidth); table.on('columnMoved', syncTopScrollWidth); table.on('renderComplete', syncTopScrollWidth); }
    function applyFilters() { const title = document.getElementById('flt-title').value.trim().toLowerCase(); const group = document.getElementById('flt-group').value.trim().toLowerCase(); const country = document.getElementById('flt-country').value.trim().toLowerCase(); const activity = document.getElementById('flt-activity').value.trim().toLowerCase(); const website = document.getElementById('flt-website').value.trim().toLowerCase(); const fromVal = document.getElementById('flt-date-from').value; const toVal = document.getElementById('flt-date-to').value; const fromDate = fromVal ? new Date(fromVal) : null; const toDate = toVal ? new Date(toVal) : null; if (toDate) toDate.setHours(23, 59, 59, 999); table.setFilter((row) => { const d = row.discovered; const dDate = parseDate(d); if (title && !(String(row.post_title || '').toLowerCase().includes(title))) return false; if (group && !(String(row.group_name || '').toLowerCase().includes(group))) return false; if (country && !(String(row.country || '').toLowerCase().includes(country))) return false; if (activity && !(String(row.activity || '').toLowerCase().includes(activity))) return false; if (website && !(String(row.website || '').toLowerCase().includes(website))) return false; if (fromDate && (!dDate || dDate < fromDate)) return false; if (toDate && (!dDate || dDate > toDate)) return false; return true; }); }
    function attachFilterHandlers() { ['flt-title', 'flt-group', 'flt-country', 'flt-activity', 'flt-website', 'flt-date-from', 'flt-date-to'].forEach(id => { document.getElementById(id).addEventListener('input', applyFilters); if (id.startsWith('flt-date')) document.getElementById(id).addEventListener('change', applyFilters); }); document.getElementById('btn-reset').addEventListener('click', () => { ['flt-title', 'flt-group', 'flt-country', 'flt-activity', 'flt-website', 'flt-date-from', 'flt-date-to'].forEach(id => document.getElementById(id).value = ''); table.clearFilter(); updateStats(table.getData()); }); document.getElementById('btn-export').addEventListener('click', () => { const visibleCols = table.getColumns().filter(c => c.isVisible && c.isVisible()).map(c => c.getField()).filter(Boolean); table.download('csv', 'ransomware_live_filtered.csv', { columns: visibleCols, rowRange: 'active' }); }); }
    function attachUpdateHandler(){ const btn=document.getElementById('btn-update'); if(!btn) return; btn.addEventListener('click', async()=>{ btn.disabled=true; const original=btn.textContent; btn.textContent='Updating...'; try{ const res=await fetch('/api/ransomware_live/refresh',{method:'POST'}); const payload=await res.json(); if(!res.ok){ alert(payload.error || 'Update failed'); return; } await loadData(); setLastUpdate(payload.updated_at || payload.updated_at_human); }catch(err){ alert('Update failed: '+err); } finally{ btn.disabled=false; btn.textContent=original; } }); }
    function attachChartModeHandler(){ const sel=document.getElementById('chart-mode'); if(!sel) return; sel.addEventListener('change',()=>{ chartMode=sel.value; updateYearChart(chartCounts.all||{}, chartCounts.muni||{}); }); }
    async function loadData(){ const res=await fetch('/api/ransomware_live'); const data=await res.json(); if(data.error){ const container=document.getElementById('rw-table'); container.innerHTML='<div style="color:#dc2626; padding:18px;">'+data.error+'</div>'; return; } fullData=data; if(!table){ buildTable(data); attachFilterHandlers(); attachUpdateHandler(); attachChartModeHandler(); } else { table.replaceData(data); updateStats(table.getData()); } }
    async function init(){ await loadData(); await fetchLastUpdate(); attachChartModeHandler(); }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
