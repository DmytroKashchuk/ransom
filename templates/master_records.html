<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Master Records (10-K)</title><link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css" rel="stylesheet"/><link href="/static/css/main.css" rel="stylesheet"/><style>.container{max-width:100%;padding:20px}.card{background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.08);padding:18px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}.filter-input{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;min-width:150px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px}.stat{background:#f1f5f9;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.2}.top-scroll{overflow-x:auto;overflow-y:hidden;height:14px;margin:8px 0;background:#f8f9fa;border:1px solid #e9ecef;border-radius:6px}.top-scroll::-webkit-scrollbar{height:10px}.btn{padding:8px 12px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8;border-radius:6px;cursor:pointer}.btn:hover{background:#1e40af}.cell-link a{color:#2563eb;text-decoration:none}.cell-link a:hover{text-decoration:underline}</style></head><body>{% include 'navbar.html' %}<div class="container"><div class="card"><h1>Master Records</h1><div class="meta" style="background:#eef2ff;padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:.9rem;color:#1e3a8a">Dataset: <code>data/10k/master_records.csv</code></div><div class="stats"><div class="stat">Rows<br><strong id="stat-rows">0</strong></div><div class="stat">Unique Tickers<br><strong id="stat-tickers">0</strong></div><div class="stat">Unique CIKs<br><strong id="stat-ciks">0</strong></div></div><div class="filters"><input id="flt-ticker" class="filter-input" placeholder="Ticker"/><input id="flt-cik" class="filter-input" placeholder="CIK"/><input id="flt-company" class="filter-input" placeholder="Company"/><input id="flt-year" class="filter-input" placeholder="Year"/></div><div style="margin:4px 0 8px"><button id="download-csv" class="btn" type="button">Download CSV</button></div><div id="top-scroll" class="top-scroll" style="display:none"><div id="top-scroll-spacer"></div></div><div id="table"></div></div></div><script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script><script>let table;function syncTop(){const s=document.getElementById('top-scroll-spacer');const el=document.querySelector('#table .tabulator-table');if(s&&el)s.style.width=el.scrollWidth+'px'}function setupTop(){const top=document.getElementById('top-scroll');const holder=document.querySelector('#table .tabulator-tableholder');if(!top||!holder)return;top.addEventListener('scroll',()=>holder.scrollLeft=top.scrollLeft);holder.addEventListener('scroll',()=>top.scrollLeft=holder.scrollLeft);syncTop();top.style.display='block';if(window.ResizeObserver){const el=document.querySelector('#table .tabulator-table');if(el)new ResizeObserver(syncTop).observe(el)}window.addEventListener('resize',syncTop)}function linkFormatter(cell){const v=cell.getValue();if(!v)return '';const safe=String(v);return `<span class="cell-link"><a href="${safe}" target="_blank" rel="noopener noreferrer">link</a></span>`}function build(data){const cols=[];if(data.length){Object.keys(data[0]).forEach(k=>{if(k==='url'){cols.push({title:k,field:k,width:160,formatter:linkFormatter,hozAlign:'center'});}else{cols.push({title:k,field:k,width:160});}})}table=new Tabulator('#table',{data,layout:'fitData',pagination:true,paginationSize:400,movableColumns:true,columnDefaults:{resizable:true,minWidth:140},initialSort:[{column:'year',dir:'desc'}],columns:cols});table.on('tableBuilt',()=>{setupTop();updateStats(table.getData())});table.on('dataFiltered',(_,rows)=>updateStats(rows.map(r=>r.getData())));['columnResized','columnMoved','renderComplete'].forEach(ev=>table.on(ev,syncTop));attach();}function updateStats(data){const tick=new Set(),ciks=new Set();data.forEach(r=>{if(r.ticker)tick.add(String(r.ticker).trim());if(r.cik||r.CIK)ciks.add(String(r.cik||r.CIK).trim())});document.getElementById('stat-rows').textContent=data.length;document.getElementById('stat-tickers').textContent=tick.size;document.getElementById('stat-ciks').textContent=ciks.size;}function attach(){['flt-ticker','flt-cik','flt-company','flt-year'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilters));document.getElementById('download-csv').addEventListener('click',()=>{const visible=table.getColumns().filter(c=>c.isVisible&&c.isVisible()).map(c=>c.getField()).filter(Boolean);table.download('csv','master_records.csv',{columns:visible,rowRange:'active'})})}function applyFilters(){const t=document.getElementById('flt-ticker').value.trim().toLowerCase();const c=document.getElementById('flt-cik').value.trim().toLowerCase();const comp=document.getElementById('flt-company').value.trim().toLowerCase();const y=document.getElementById('flt-year').value.trim();table.setFilter(row=>{if(t&&!String(row.ticker||'').toLowerCase().includes(t))return false;if(c&&!String(row.cik||row.CIK||'').toLowerCase().includes(c))return false;if(comp&&!String(row.company||row.company_name||'').toLowerCase().includes(comp))return false;if(y&&String(row.year||'')!==y)return false;return true})}async function init(){const r=await fetch('/api/master_records');const d=await r.json();if(d.error){document.getElementById('table').innerHTML='<div style="color:#dc2626;padding:18px">'+d.error+'</div>';return}build(d)}document.addEventListener('DOMContentLoaded',init);</script></body></html>
