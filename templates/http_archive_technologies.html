<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTTP Archive Technologies</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    body { margin:0; background:#0f172a; color:#0b1220; }
    .page { width:100%; max-width:100%; padding:18px 20px 60px; }
    .panel { background:#ffffff; border-radius:16px; padding:22px 24px 30px; box-shadow:0 12px 32px -10px rgba(0,0,0,0.32); }
    .headline { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:flex-end; margin:0 0 14px; }
    .headline h1 { margin:0; font-size:1.85rem; color:#0f172a; }
    .stats { display:flex; flex-wrap:wrap; gap:14px; margin:6px 0 18px; }
    .stat { background:#f1f5f9; padding:12px 14px; border-radius:12px; min-width:150px; font-size:13px; line-height:1.35; box-shadow:inset 0 1px 0 #fff; }
    .stat strong { display:block; font-size:22px; color:#0f172a; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px; }
    .filter-input { padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; min-width:180px; font-size:14px; background:#f8fafc; }
    .filter-input:focus { outline:2px solid #6366f1; outline-offset:1px; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #6366f1; background:#6366f1; color:#fff; cursor:pointer; font-weight:600; }
    .btn-alt { background:#475569; border-color:#475569; }
    .btn-ghost { background:#e2e8f0; border-color:#e2e8f0; color:#0f172a; }
    .top-scroll { overflow-x:auto; overflow-y:hidden; height:14px; margin:8px 0 10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; display:none; }
    .top-scroll::-webkit-scrollbar { height:10px; }
    .top-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; }
    .top-scroll::-webkit-scrollbar-track { background:#f1f5f9; }
    .tabulator-col-title { font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.4px; }
    .domain-link { color:#0f172a; font-weight:600; text-decoration:underline; text-decoration-thickness:2px; }
    .tech-preview { color:#0f172a; font-size:13px; line-height:1.4; }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="page">
    <div class="panel">
      <div class="headline">
        <h1>HTTP Archive Technologies</h1>
        <button id="btn-export" class="btn" type="button">Download CSV</button>
      </div>
      <div class="stats" id="stats-bar">
        <div class="stat">Rows<br><strong id="stat-rows">0</strong></div>
        <div class="stat">Domains<br><strong id="stat-domains">0</strong></div>
        <div class="stat">Avg Tech/Row<br><strong id="stat-avg-tech">0</strong></div>
      </div>
      <div class="filters">
        <input id="flt-domain" class="filter-input" placeholder="Domain" />
        <input id="flt-group" class="filter-input" placeholder="Group" />
        <input id="flt-tech" class="filter-input" placeholder="Technology contains" />
        <input id="flt-crawl" class="filter-input" type="date" placeholder="Crawl Date" />
        <button id="btn-reset" class="btn-alt btn" type="button">Reset</button>
        <button id="btn-open-timeline" class="btn-ghost btn" type="button">Open timeline for domain</button>
      </div>
      <div id="top-scroll" class="top-scroll"><div id="top-scroll-spacer"></div></div>
      <div id="tech-table"></div>
    </div>
  </div>
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  <script>
    let table; let payload=null;
    function syncTopScrollWidth(){ const spacer=document.getElementById('top-scroll-spacer'); const el=document.querySelector('#tech-table .tabulator-table'); if(spacer&&el) spacer.style.width=el.scrollWidth+'px'; }
    function setupTopScroll(){ const top=document.getElementById('top-scroll'); const holder=document.querySelector('#tech-table .tabulator-tableholder'); if(!top||!holder) return; top.addEventListener('scroll',()=>holder.scrollLeft=top.scrollLeft); holder.addEventListener('scroll',()=>top.scrollLeft=holder.scrollLeft); syncTopScrollWidth(); top.style.display='block'; if(window.ResizeObserver){ const el=document.querySelector('#tech-table .tabulator-table'); if(el) new ResizeObserver(syncTopScrollWidth).observe(el);} window.addEventListener('resize',syncTopScrollWidth); }
    function updateStats(data){ const rows=data.length; const domains=new Set(data.map(r=>r.domain_name).filter(Boolean)).size; const avg=rows? (data.reduce((a,b)=>a+(Number(b.tech_count)||0),0)/rows).toFixed(1):'0'; document.getElementById('stat-rows').textContent=rows; document.getElementById('stat-domains').textContent=domains; document.getElementById('stat-avg-tech').textContent=avg; }
    function techFormatter(cell){ const v=cell.getValue(); if(!v) return ''; return `<span class="tech-preview">${v}</span>`; }
    function domainFormatter(cell){ const v=cell.getValue(); if(!v) return '-'; const enc=encodeURIComponent(v); return `<a class="domain-link" href="/http_archive/technologies/${enc}">${v}</a>`; }
    function linkFormatter(cell){ const v=cell.getValue(); if(!v) return '-'; const safe=v.replace(/"/g,'&quot;'); return `<a href="${safe}" target="_blank" style="color:#2563eb;">link</a>`; }
    function buildTable(data){ table=new Tabulator('#tech-table',{ data, layout:'fitData', pagination:true, paginationSize:300, movableColumns:true, columnDefaults:{resizable:true,minWidth:140}, columns:[
      {title:'Domain', field:'domain_name', width:220, formatter:domainFormatter},
      {title:'Post Title', field:'post_title', width:260},
      {title:'Group', field:'group_name', width:140},
      {title:'Published', field:'published', width:130},
      {title:'Crawl Date', field:'crawl_date', width:130},
      {title:'Root Page', field:'root_page', width:320, formatter:linkFormatter},
      {title:'Tech Count', field:'tech_count', width:120},
      {title:'Tech Preview', field:'tech_preview', width:420, formatter:techFormatter},
      {title:'Hacked', field:'hacked', width:110},
      {title:'Population', field:'population', width:120},
      {title:'Start Date', field:'start_date', width:130},
      {title:'End Date', field:'end_date', width:130},
      {title:'Match ID', field:'Matchid', width:110},
      {title:'Link', field:'Link', width:140, formatter:linkFormatter},
      {title:'Tech Raw', field:'tech_cat_ver', width:360},
    ], });
      table.on('tableBuilt',()=>{ setupTopScroll(); updateStats(table.getData()); });
      table.on('dataFiltered',(_,rows)=> updateStats(rows.map(r=>r.getData())));
      table.on('columnResized',syncTopScrollWidth);
      table.on('columnMoved',syncTopScrollWidth);
      table.on('renderComplete',syncTopScrollWidth);
    }
    function applyFilters(){ const domain=document.getElementById('flt-domain').value.trim().toLowerCase(); const group=document.getElementById('flt-group').value.trim().toLowerCase(); const tech=document.getElementById('flt-tech').value.trim().toLowerCase(); const crawl=document.getElementById('flt-crawl').value.trim(); table.setFilter(row=>{ if(domain && !(String(row.domain_name||'').toLowerCase().includes(domain))) return false; if(group && !(String(row.group_name||'').toLowerCase().includes(group))) return false; if(tech && !(String(row.tech_cat_ver||'').toLowerCase().includes(tech))) return false; if(crawl && String(row.crawl_date||'')!==crawl) return false; return true; }); }
    function attachFilters(){ ['flt-domain','flt-group','flt-tech','flt-crawl'].forEach(id=>{ const el=document.getElementById(id); if(!el) return; const evt=id==='flt-crawl'?'change':'input'; el.addEventListener(evt,applyFilters); }); document.getElementById('btn-reset').addEventListener('click',()=>{ ['flt-domain','flt-group','flt-tech','flt-crawl'].forEach(id=>document.getElementById(id).value=''); table.clearFilter(); updateStats(table.getData()); }); document.getElementById('btn-export').addEventListener('click',()=>{ const visibleCols=table.getColumns().filter(c=>c.isVisible && c.isVisible()).map(c=>c.getField()).filter(Boolean); table.download('csv','http_archive_technologies.csv',{columns:visibleCols,rowRange:'active'}); }); document.getElementById('btn-open-timeline').addEventListener('click',()=>{ const domain=document.getElementById('flt-domain').value.trim(); if(!domain){ alert('Enter a domain in the Domain filter to open its timeline.'); return; } window.location.href='/http_archive/technologies/'+encodeURIComponent(domain); }); }
    async function init(){ const res=await fetch('/api/http_archive/tech_grouped'); const data=await res.json(); if(data.error){ document.getElementById('tech-table').innerHTML='<div style="color:#dc2626; padding:18px;">'+data.error+'</div>'; return; } payload=data; buildTable(data.data||data); attachFilters(); }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
