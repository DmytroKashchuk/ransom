<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technology Timeline</title>
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    body { margin:0; background:#0f172a; color:#0b1220; }
    .page { width:100%; max-width:100%; padding:18px 20px 60px; }
    .panel { background:#ffffff; border-radius:16px; padding:22px 24px 30px; box-shadow:0 12px 32px -10px rgba(0,0,0,0.32); }
    .headline { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin:0 0 6px; }
    .headline h1 { margin:0; font-size:1.8rem; color:#0f172a; }
    .subtitle { margin:0 0 18px; color:#475569; font-size:15px; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #6366f1; background:#6366f1; color:#fff; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:0 0 16px; }
    .summary-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; }
    .summary-card h3 { margin:0 0 6px; font-size:13px; color:#475569; letter-spacing:.3px; text-transform:uppercase; }
    .summary-card p { margin:0; font-size:14px; color:#0f172a; line-height:1.4; }
    .timeline { position:relative; padding-left:26px; margin-top:12px; }
    .timeline::before { content:""; position:absolute; left:10px; top:0; bottom:0; width:4px; background:linear-gradient(180deg, #cbd5e1, #94a3b8); border-radius:2px; }
    .timeline-item { position:relative; margin-bottom:18px; padding-left:12px; }
    .timeline-item:last-child { margin-bottom:0; }
    .dot { position:absolute; left:-4px; top:10px; width:12px; height:12px; background:#6366f1; border-radius:50%; box-shadow:0 0 0 4px #e0e7ff; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px 16px; box-shadow:0 8px 24px -10px rgba(0,0,0,0.25); }
    .card-header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 0 8px; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:#eef2ff; color:#312e81; border-radius:999px; font-size:12px; font-weight:600; border:1px solid #c7d2fe; }
    .tech-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; margin:4px 6px 4px 0; background:#e2e8f0; color:#0f172a; border-radius:999px; font-size:12px; }
    .tech-chip .cat { color:#475569; font-weight:600; }
    .meta { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 0; color:#475569; font-size:12px; }
    .meta span { background:#f1f5f9; padding:6px 8px; border-radius:8px; border:1px solid #e2e8f0; }
    .empty { padding:18px; background:#f1f5f9; border-radius:12px; border:1px solid #e2e8f0; color:#475569; }
    .error { padding:18px; background:#fef2f2; border:1px solid #fecaca; border-radius:12px; color:#b91c1c; }
    .root-link { color:#2563eb; font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="page">
    <div class="panel">
      <div class="headline">
        <div>
          <h1>Technology Timeline</h1>
          <p class="subtitle" id="subtitle-domain">{{ domain }}</p>
        </div>
        <a class="btn" href="/http_archive/technologies">Back to table</a>
      </div>
      <div id="summary" class="summary-grid"></div>
      <div id="timeline" class="timeline"></div>
    </div>
  </div>
  <script>
    const domain = "{{ domain }}";
    const timelineEl = document.getElementById('timeline');
    const summaryEl = document.getElementById('summary');

    function renderSummary(summary){
      summaryEl.innerHTML='';
      const items=[
        {label:'Domain', value: summary.domain || domain},
        {label:'Group', value: summary.group_name || '—'},
        {label:'Post Title', value: summary.post_title || '—'},
        {label:'Published', value: summary.published || '—'},
        {label:'Start Date', value: summary.start_date || '—'},
        {label:'End Date', value: summary.end_date || '—'},
        {label:'Population', value: summary.population || '—'},
        {label:'Hacked Flag', value: summary.hacked || '—'},
        {label:'Events', value: summary.total_events != null ? summary.total_events : '—'},
        {label:'Unique Tech', value: summary.unique_technologies != null ? summary.unique_technologies : '—'},
      ];
      items.forEach(item=>{
        const card=document.createElement('div');
        card.className='summary-card';
        card.innerHTML=`<h3>${item.label}</h3><p>${item.value}</p>`;
        summaryEl.appendChild(card);
      });
    }

    function techChips(techs){
      if(!techs || !techs.length) return '<div class="empty">No technologies listed.</div>';
      return techs.map(t=>{
        const name=t.name||'Unknown';
        const cat=t.category? `<span class="cat">${t.category}</span>`:'';
        const ver=t.version? `<span class="ver">${t.version}</span>`:'';
        return `<span class="tech-chip">${name}${cat?' · '+cat:''}${ver?' · '+ver:''}</span>`;
      }).join('');
    }

    function renderTimeline(events){
      if(!events || !events.length){
        timelineEl.innerHTML='<div class="empty">No crawl events available for this domain.</div>';
        return;
      }
      timelineEl.innerHTML='';
      events.forEach((ev)=>{
        const wrapper=document.createElement('div');
        wrapper.className='timeline-item';
        wrapper.innerHTML=`
          <span class="dot"></span>
          <div class="card">
            <div class="card-header">
              <div class="badge">${ev.crawl_date || 'Unknown crawl date'}</div>
              ${ev.root_page ? `<a class="root-link" href="${ev.root_page}" target="_blank">${ev.root_page}</a>` : ''}
            </div>
            <div class="meta">
              ${ev.group_name ? `<span>Group: ${ev.group_name}</span>` : ''}
              ${ev.published ? `<span>Published: ${ev.published}</span>` : ''}
              ${ev.tech_count != null ? `<span>${ev.tech_count} technologies</span>` : ''}
              ${ev.matchid ? `<span>Match ID: ${ev.matchid}</span>` : ''}
            </div>
            <div style="margin-top:10px;">${techChips(ev.technologies)}</div>
          </div>`;
        timelineEl.appendChild(wrapper);
      });
    }

    async function init(){
      try {
        const res = await fetch('/api/http_archive/tech_grouped/'+encodeURIComponent(domain));
        const payload = await res.json();
        if(payload.error){
          timelineEl.innerHTML='<div class="error">'+payload.error+'</div>';
          return;
        }
        renderSummary(payload.summary || {});
        renderTimeline(payload.timeline || []);
      } catch (err) {
        timelineEl.innerHTML='<div class="error">Failed to load timeline.</div>';
      }
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
