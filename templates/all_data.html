<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>All Data (10-K Feature Matrix)</title><link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_simple.min.css" rel="stylesheet"/><link href="/static/css/main.css" rel="stylesheet"/><style>.container{max-width:100%;padding:18px}.card{background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.08);padding:18px}.meta{background:#eef2ff;padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:.9rem;color:#1e3a8a}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}.filter-input{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;min-width:150px}.statbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}.stat{background:#f1f5f9;padding:6px 10px;border-radius:8px;font-size:12px}.btn{padding:8px 12px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8;border-radius:6px;cursor:pointer}.btn:hover{background:#1e40af}.top-scroll{overflow-x:auto;overflow-y:hidden;height:14px;margin:8px 0;background:#f8f9fa;border:1px solid #e9ecef;border-radius:6px}.top-scroll::-webkit-scrollbar{height:10px}</style></head><body>{% include 'navbar.html' %}<div class="container"><div class="card"><h1>10-K Feature Matrix</h1><div class="meta">Dataset: <code>data/10k/all_data.csv</code> (binary presence of disclosures per CIK)</div><div class="statbar"><div class="stat">Rows<br><strong id="stat-rows">0</strong></div><div class="stat">Features<br><strong id="stat-cols">0</strong></div><div class="stat">Selected (Non-zero) Features<br><strong id="stat-active">0</strong></div></div><div class="filters"><input id="flt-cik" class="filter-input" placeholder="Filter CIK"/><input id="flt-any" class="filter-input" placeholder="Feature contains (name)"/><select id="sel-density" class="filter-input"><option value="">Density >= (%)</option><option value="0">0</option><option value="1">1</option><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option></select><button id="btn-reset" class="btn" type="button">Reset Filters</button><button id="btn-download" class="btn" type="button">Download CSV</button></div><div id="top-scroll" class="top-scroll" style="display:none"><div id="top-scroll-spacer"></div></div><div id="table"></div></div></div><script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script><script>let table,rawData=[];function build(data){rawData=data;const cols=[];if(data.length){Object.keys(data[0]).forEach(k=>{cols.push({title:k,field:k,width:(k==='cik'?140:150),hozAlign:(k==='cik'?'left':'center')})});}table=new Tabulator('#table',{data,layout:'fitData',height:"72vh",virtualDom:true,pagination:false,movableColumns:true,selectable:false,columnDefaults:{resizable:true,minWidth:120},columns:cols});table.on('tableBuilt',()=>{setupTop();updateStats();});['columnResized','columnMoved','renderComplete'].forEach(ev=>table.on(ev,syncTop));attachFilters();}function syncTop(){const s=document.getElementById('top-scroll-spacer');const el=document.querySelector('#table .tabulator-table');if(s&&el)s.style.width=el.scrollWidth+'px'}function setupTop(){const top=document.getElementById('top-scroll');const holder=document.querySelector('#table .tabulator-tableholder');if(!top||!holder)return;top.addEventListener('scroll',()=>holder.scrollLeft=top.scrollLeft);holder.addEventListener('scroll',()=>top.scrollLeft=holder.scrollLeft);syncTop();top.style.display='block';if(window.ResizeObserver){const el=document.querySelector('#table .tabulator-table');if(el)new ResizeObserver(syncTop).observe(el)}window.addEventListener('resize',syncTop)}function updateStats(){const rows=table.getData();document.getElementById('stat-rows').textContent=rows.length;const cols=table.getColumns().length;document.getElementById('stat-cols').textContent=cols;let active=0;if(rows.length){const keys=Object.keys(rows[0]).filter(k=>k!=='cik');keys.forEach(k=>{if(rows.some(r=>Number(r[k])===1))active++;});}document.getElementById('stat-active').textContent=active;}function resetFilters(){document.getElementById('flt-cik').value='';document.getElementById('flt-any').value='';document.getElementById('sel-density').value='';table.setFilter(()=>true);updateStats();}function applyFilters(){const cik=document.getElementById('flt-cik').value.trim().toLowerCase();const any=document.getElementById('flt-any').value.trim().toLowerCase();const density=document.getElementById('sel-density').value;let densityVal=density?parseFloat(density):null;table.setFilter(row=>{if(cik && !String(row.cik||'').toLowerCase().includes(cik))return false;if(any){const cols=Object.keys(row).filter(k=>k!=='cik');if(!cols.some(c=>c.toLowerCase().includes(any)))return false;}if(densityVal!==null){const cols=Object.keys(row).filter(k=>k!=='cik');const ones=cols.reduce((acc,c)=>acc+(Number(row[c])===1?1:0),0);const pct=(ones/cols.length)*100;if(pct<densityVal)return false;}return true;});updateStats();}function attachFilters(){document.getElementById('flt-cik').addEventListener('input',applyFilters);document.getElementById('flt-any').addEventListener('input',applyFilters);document.getElementById('sel-density').addEventListener('change',applyFilters);document.getElementById('btn-reset').addEventListener('click',resetFilters);document.getElementById('btn-download').addEventListener('click',()=>{const visible=table.getColumns().map(c=>c.getField()).filter(Boolean);table.download('csv','all_data_filtered.csv',{columns:visible,rowRange:'active'});});}async function init(){const r=await fetch('/api/all_data');const d=await r.json();if(d.error){document.getElementById('table').innerHTML='<div style="color:#dc2626;padding:18px">'+d.error+'</div>';return;}build(d);}document.addEventListener('DOMContentLoaded',init);</script></body></html>
